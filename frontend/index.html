<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Altitude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <canvas id="scene" width="240" height="152" aria-hidden="true"></canvas>
  <div id="scanlines" aria-hidden="true"></div>
  <div id="tag" hidden></div>

  <div id="app">
    <header id="top">
      <div id="logo">ALTITUDE</div>
      <nav>
        <button id="nav-climb" class="tab" type="button">Climb</button>
        <button id="nav-shop" class="tab" type="button">Shop</button>
        <div id="wallet"><span class="coin" aria-hidden="true"></span><span id="coins">0</span></div>
      </nav>
    </header>

    <main id="stage">
      <section id="view-start" class="panel side" hidden>
        <form id="start-form">
          <label class="label" for="task">What are you working on?</label>
          <input id="task" type="text" maxlength="40" autocomplete="off" required>
          <label class="label" for="minutes">Climb length</label>
          <select id="minutes">
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="25" selected>25 minutes</option>
            <option value="50">50 minutes</option>
          </select>
          <button class="primary" type="submit">Start climbing</button>
        </form>
      </section>

      <section id="view-active" class="panel side" hidden>
        <div class="label">Climbing on</div>
        <div id="active-task"></div>
        <div id="time">00:00</div>
        <div id="length" class="label"></div>
        <div class="row">
          <button id="pause" class="primary" type="button">Pause</button>
          <button id="finish" class="secondary" type="button">Finish</button>
        </div>
      </section>

      <section id="view-done" class="panel side" hidden>
        <div id="done-kicker" class="label gold"></div>
        <h1 id="done-title"></h1>
        <p id="done-text"></p>
        <div id="stats"></div>
        <div class="row">
          <button id="again" class="primary" type="button">Keep climbing</button>
          <button id="to-shop" class="secondary" type="button">Shop</button>
        </div>
      </section>

      <aside id="ladder" class="panel" hidden>
        <div class="label">The way up</div>
        <div id="rungs"></div>
      </aside>

      <section id="view-shop" hidden>
        <div class="panel" id="fitting">
          <div class="label">Your hiker</div>
          <canvas id="preview" width="12" height="16" role="img" aria-label="Your hiker in the selected outfit"></canvas>
          <div id="pick-name"></div>
          <button id="buy" class="primary" type="button"></button>
          <div id="shop-note" class="label"></div>
        </div>
        <div id="items"></div>
      </section>
    </main>

    <footer id="next" class="panel" hidden>
      <div class="row spread"><span id="next-name"></span><span id="next-left"></span></div>
      <div id="bar"><div id="bar-fill"></div></div>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
